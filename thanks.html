<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявка принята — LEADMEET</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0b1f3a;--mute:#5b6874;--line:#d7dee5;--bg:#eef1f4;--brand:#2d8cff;--ok:#22c55e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:480px;text-align:center;background:#fff;border:1px solid var(--line);padding:40px 32px}
  .ok{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 20px}
  h1{font-size:23px;font-weight:800;margin:0 0 12px;letter-spacing:-.02em}
  p{color:var(--mute);font-size:15px;line-height:1.6;margin:0 0 22px}
  a.btn{display:inline-block;font:inherit;font-size:15px;font-weight:700;padding:13px 22px;background:var(--ink);color:#fff;text-decoration:none;border-radius:2px}
  a.btn:hover{background:var(--brand)}
  .name{font-size:13px;color:var(--mute);margin-top:24px}
</style>
</head>
<body>
  <div class="card">
    <div class="ok">✓</div>
    <h1>Заявка принята</h1>
    <p>Если чат в Telegram не открылся автоматически — напишите мне напрямую, я отвечаю сам и обычно в течение рабочего дня. Пока ждёте — можно посмотреть реальные кейсы отделов продаж, которые я строил.</p>
    <a class="btn" href="https://t.me/vladlev007" target="_blank" rel="noopener">Написать в Telegram</a>
    <div class="name">LEADMEET · Влад Лев</div>
  </div>
</body>
</html>
